name: Version Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 2
          token: ${{ secrets.PR_VERSION_PUSH_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Check for plugin changes
        id: check
        run: |
          # Check if the merge to main changed any plugin content
          PLUGIN_DIFF=$(git diff HEAD~1..HEAD -- 'skills/' 'agents/' '.mcp.json' '.claude-plugin/plugin.json' '.cursor-plugin/plugin.json' 'generated/polygraph/')
          if [ -z "$PLUGIN_DIFF" ]; then
            echo "No plugin content changes detected. Skipping version bump."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Plugin content changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute and apply release version
        if: steps.check.outputs.has_changes == 'true'
        id: compute
        run: |
          # Read current version from the merge commit
          CURRENT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8')).version)")
          echo "Current version: $CURRENT"

          # Strip any pre-release suffix and bump patch
          BASE=$(echo "$CURRENT" | sed 's/-.*//')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          RELEASE="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version: $RELEASE"

          node scripts/bump-version.mjs --version "$RELEASE"
          npx nx sync-artifacts

      - name: Commit and push if changed
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.compute.outputs.release }}"
          git push
