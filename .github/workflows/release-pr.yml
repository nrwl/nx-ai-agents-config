name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Run from `main` for a stable release, or from `next` for an
      # X.Y.Z-next.N prerelease (see scripts/release-version.mjs).
      - name: Prepare release
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          BRANCH: ${{ github.ref_name }}
        run: |
          RELEASE="$(node scripts/release-version.mjs bump "$BUMP" --branch "$BRANCH")"
          echo "value=$RELEASE" >> "$GITHUB_OUTPUT"
          node scripts/bump-version.mjs --version "$RELEASE"
          npx nx sync-artifacts

      - name: Open release pull request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: release/v${{ steps.version.outputs.value }}
          base: ${{ github.ref_name }}
          title: 'chore: release ${{ steps.version.outputs.value }}'
          commit-message: 'chore: release ${{ steps.version.outputs.value }}'
          body: |
            Automated release PR for `${{ steps.version.outputs.value }}`.

            Merge this PR into `${{ github.ref_name }}` to stage the release. Stage Release then publishes the npm packages and moves the release branch Claude Code and Cursor read from, once approved.
          delete-branch: true
