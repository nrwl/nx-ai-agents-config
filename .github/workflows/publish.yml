name: Stage Release

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Detect release version bump
        id: release
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # New branch or rewritten history: nothing to compare against.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_version='JSON.parse(require("fs").readFileSync(0, "utf8")).version'
          before_version="$(git show "$BEFORE:.claude-plugin/plugin.json" | node -p "$read_version")"
          after_version="$(node -p "$read_version" < .claude-plugin/plugin.json)"

          # Empty unless the version went up, so a revert never republishes.
          # Fails when the version belongs to the other branch's channel.
          dist_tag="$(node scripts/release-version.mjs detect "$before_version" "$after_version" --branch "$BRANCH")"
          if [ -z "$dist_tag" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$after_version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

  stage:
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # npm staged publishing requires npm 11.15.0 or newer.
        run: npm install -g npm@11.15.0

      - name: Build plugin packages
        run: node scripts/package-plugins.mjs

      # Every step below is safe to re-run after a partial failure.
      - name: Create release tag
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if tagged="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}")"; then
            if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
              echo "Tag v$VERSION already points at $tagged"
              exit 1
            fi
          else
            git tag "v$VERSION"
          fi

      - name: Publish Claude Code plugin on npm
        working-directory: dist/claude
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Publish Codex plugin on npm
        working-directory: dist/codex
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Publish OpenCode plugin on npm
        working-directory: dist/opencode
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      # Claude Code reads the marketplace and Cursor the plugin itself from
      # `dist/<dist-tag>` (nx writes it as the marketplace `ref` and Cursor
      # `gitRef`), so moving it is what ships the release to them. Holding a
      # workspace on one release uses the tag. The branch only moves forward.
      - name: Push release tag and branch
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
        run: git push origin "v$VERSION" "HEAD:refs/heads/dist/$DIST_TAG"
